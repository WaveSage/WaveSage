<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>WaveSage</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0b1c2c;
        color: #e8f4f8;
        text-align: center;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        max-width: 28rem;
        line-height: 1.45;
        color: #9eb8c4;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>WaveSage</h1>
      <p>
        Connecting to live conditions… If this screen stays up, set
        <code>CAPACITOR_SERVER_URL</code> to your deployed WaveSage site and run
        <code>npx cap sync</code>.
      </p>
    </div>
  </body>
</html>
